<!doctype html><meta charset="utf-8"><title>Development rig experiment · not gameplay</title>
<style>body{margin:20px;background:#152129;color:#f1e8d1;font:15px system-ui}h1{font-size:22px;margin:8px 0}p{margin:8px 0}main{display:grid;grid-template-columns:repeat(3,540px);gap:14px}.card{background:#26363d;border:1px solid #526168;padding:8px}.full{height:490px;width:540px;overflow:hidden;position:relative;background:#37464b}.crop{height:300px;width:540px;overflow:hidden;position:relative;background:#445257;margin-top:8px}.scene{width:1500px;height:1250px;position:absolute;transform-origin:0 0}.full .scene{transform:scale(.4)}.crop .scene{transform:translate(-1050px,-690px) scale(1.8)}img{position:absolute;max-width:none}.body{left:0;top:0;width:1312px}.pivot{position:absolute;left:740px;top:500px;transform-origin:0 0}.sword{left:-78px;top:-109.5px;width:651.6px;height:217.2px}.hand{left:270.66px;top:167.06px;width:813.44px;height:743.38px}.original-hand{position:absolute;left:0;top:0;width:1312px;height:1199px;pointer-events:none}.original-hand img{left:0;top:0;width:1312px;height:1199px}.finger-mask{clip-path:polygon(748px 476px,762px 480px,779px 491px,778px 500px,771px 506px,772px 515px,764px 523px,757px 529px,747px 531px,738px 525px,729px 515px,729px 508px,738px 506px,747px 514px,753px 516px,751px 506px,741px 494px)}.thumb-mask{clip-path:polygon(718px 478px,731px 472px,744px 474px,751px 481px,750px 489px,744px 494px,733px 491px,723px 491px,713px 499px,707px 499px,710px 488px)}.label{font-weight:700;margin-bottom:6px}button{padding:8px;margin:8px 6px 8px 0}#status{color:#a8d5c1}</style>
<h1>开发 rig 实验 · 三层浏览器实验页面（尚未完成渲染验证） · 非游戏截图 / 非最终动画</h1><p>底身体 → 剑 → 前手。剑 scale 0.30，(260,365) → 身体 (740,500)。默认前手复用身体原纹理，仅用手指与拇指多边形遮罩；未修图，坐标为人工初标，尚未渲染验收。生成拳仅对照：scale 0.62，(757,537) → 同握点。只旋转剑，前手不动。</p><button id="original">原像素多边形</button><button id="generated">生成拳对照</button><button id="none">无前手对照</button><span id="status">原像素手指多边形（未渲染验收）</span><main></main>
<script>
const main=document.querySelector('main');for(const angle of [-12,0,12]){let c=document.createElement('section');c.className='card';c.innerHTML=`<div class=label>剑角度 ${angle}° ｜上：全身 .4×；下：握柄 1.8×</div>`;for(const type of ['full','crop']){const v=document.createElement('div');v.className=type;v.innerHTML=`<div class="scene"><img class="body" src="../sword-retracted-body-v1.png"><div class="pivot" style="transform:rotate(${angle}deg)"><img class="sword" src="../sword-prop-v1.png"></div><img class="hand" style="display:none" src="../sword-front-hand-v1.png"><div class="original-hand"><img class="finger-mask" src="../sword-retracted-body-v1.png"><img class="thumb-mask" src="../sword-retracted-body-v1.png"></div></div>`;c.append(v)}main.append(c)}function setMode(mode){document.querySelectorAll('.hand').forEach(n=>n.style.display=mode==='generated'?'block':'none');document.querySelectorAll('.original-hand').forEach(n=>n.style.display=mode==='original'?'block':'none');document.querySelector('#status').textContent={original:'原像素手指多边形（未渲染验收）',generated:'生成拳对照（尚未验证肤色/轮廓）',none:'无前手：观察底图原拳与武器'}[mode]}for(const mode of ['original','generated','none'])document.getElementById(mode).onclick=()=>setMode(mode);window.ready=Promise.all([...document.images].map(im=>im.decode()));
</script>
